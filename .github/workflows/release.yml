name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate JSON
        run: npm run validate:json

      - name: Package Chrome and Firefox
        run: npm run package

      - name: Lint Firefox package
        run: npx web-ext lint --source-dir dist/firefox

      - name: Resolve version from tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "chrome_zip=builds/better-easy-dots-chrome-v${VERSION}.zip" >> "$GITHUB_OUTPUT"
          echo "firefox_zip=builds/better-easy-dots-firefox-v${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Verify ZIP filenames match tag
        run: |
          test -f "${{ steps.meta.outputs.chrome_zip }}"
          test -f "${{ steps.meta.outputs.firefox_zip }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Better Easy Dots ${{ steps.meta.outputs.version }}
          files: |
            ${{ steps.meta.outputs.chrome_zip }}
            ${{ steps.meta.outputs.firefox_zip }}
          generate_release_notes: true
          fail_on_unmatched_files: true
