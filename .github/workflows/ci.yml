name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate JSON manifests and locales
        run: npm run validate:json

      - name: Package Chrome and Firefox
        run: npm run package

      - name: Lint Firefox package
        run: npx web-ext lint --source-dir dist/firefox

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: builds/*.zip
          if-no-files-found: error
