<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Better Easy Dots</title>
  <link rel="stylesheet" href="eed-animations.css">

<body>

      </button>
    </header>

    <main class="eed-popup-body fadeIn animated eed-animate-delay-1">
      <div class="eed-popup-stars" aria-hidden="true">
        <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span>
      </div>
      <h2 data-i18n="popupReviewHeading"></h2>
      <p>
        <span data-i18n="popupReviewBodyBefore"></span> <a href="#" id="eed-popup-store-link" class="eed-popup-store-link" data-i18n="popupReviewStoreLink"></a><span data-i18n="popupReviewBodyAfter"></span>
      </p>
    </main>

    <footer class="eed-popup-footer fadeIn animated eed-animate-delay-2">
      <button type="button" id="eed-popup-settings-footer" class="eed-popup-btn eed-popup-btn-ghost waves-effect" data-i18n="popupSettingsTitle"></button>
      <button type="button" id="eed-popup-review" class="eed-popup-btn eed-popup-btn-primary waves-effect waves-light" data-i18n="popupReviewButton"></button>
    </footer>

    <span id="eed-popup-version" class="eed-popup-version"></span>
  </div>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="eed-waves.js"></script>
  <script src="popup.js"></script>
</body>
</html>
